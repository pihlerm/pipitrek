<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Task Log</title>
    <link rel="stylesheet" href="style.css" />
    <style>
        html, body { height: 100%; margin: 0; overflow: hidden; }
        #task-log-text { width: 100%; height: 100%; box-sizing: border-box; resize: none; }
    </style>
</head>
<body class="night-mode">
    <textarea id="task-log-text" class="output-text" readonly></textarea>
<script>
    const logElement = document.getElementById('task-log-text');
    let lastLogLine = 0;
    let currentDay = null;

    function localDay() {
        const d = new Date();
        const pad = n => String(n).padStart(2, '0');
        return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    }

    function followTaskLog() {
        const day = localDay();
        if (day !== currentDay) {
            currentDay = day;
            lastLogLine = 0;
            logElement.value = '';
        }
        fetch('/get_task_log/' + day + '?from_line=' + lastLogLine)
        .then(response => response.json())
        .then(data => {
            if (data.status === 'ok') {
                if (data.task_log.length > 0) {
                    logElement.value += data.task_log.join('');
                    lastLogLine += data.task_log.length;
                    logElement.scrollTop = logElement.scrollHeight;
                }
            } else {
                logElement.value += 'Error: ' + data.message + '\n';
            }
        })
        .catch(error => console.error('Task log error:', error))
        .finally(() => setTimeout(followTaskLog, 2000));
    }

    followTaskLog();
</script>
</body>
</html>
